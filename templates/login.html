{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <div class="glass-card auth-card">
        <h2>Welcome Back</h2>
        <p class="auth-subtitle">Login to access your secure dashboard.</p>
        
        <form method="POST" action="{{ url_for('login') }}" class="auth-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email" class="form-control">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password" class="form-control">
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">Login to System</button>
        </form>
        
        <p class="auth-footer">
            Don't have an account? <a href="{{ url_for('register') }}" class="neon-link">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
